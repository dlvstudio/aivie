lesson_id: vi_grade7_tuy_nhung
grade: 7
repeat: 3
eta_teach: 0.5
w_init: 2.0

pattern_id: vi_tuy_S_V_nhung_S_V
slots:
  - const: "Tuy"
  - var: S1
  - var: V1
  - const: "nhưng"
  - var: S2
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
  - "Tuy em mệt nhưng em học"
  - "Tuy Lan khóc nhưng Lan cười"
  - "Tuy trời mưa nhưng Lan đi"
  - "Tuy bài khó nhưng em làm"
  - "Tuy chó sợ nhưng chó sủa"
