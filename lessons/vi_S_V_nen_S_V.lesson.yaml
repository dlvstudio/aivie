lesson_id: vi_grade3_compound_nen
grade: 3
repeat: 3
eta_teach: 0.5
w_init: 2.0

pattern_id: vi_S_V_nen_S_V
slots:
  - var: S1
  - gap: s+
    min: 0
  - var: V1
  - const: "nên"
  - var: S2
  - gap: s+
    min: 0
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
  - "Trời mưa nên Bé ngủ"
  - "Em mệt nên Lan nghỉ"
  - "Lan đói nên em ăn"
  - "Trời tối nên mẹ đi"
  - "Bé khóc nên mẹ dỗ"
  - "Chó sủa nên mèo chạy"
