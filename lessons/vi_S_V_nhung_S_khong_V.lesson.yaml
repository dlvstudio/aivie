lesson_id: vi_grade3_compound_nhung
grade: 3
repeat: 3
eta_teach: 0.5
w_init: 2.0

pattern_id: vi_S_V_nhung_S_khong_V
slots:
  - var: S1
  - gap: s+
    min: 0
  - var: V1
  - const: "nhưng"
  - var: S2
  - const: "không"
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
  - "Em đi nhưng Bé không đi"
  - "Lan học nhưng em không học"
  - "Mẹ nấu nhưng Bố không nấu"
  - "Trời mưa nhưng Em không đi"
  - "Em muốn nhưng Lan không muốn"
  - "Mèo chạy nhưng chó không chạy"
