lesson_id: vi_grade3_compound_roi
grade: 3
repeat: 3
eta_teach: 0.5
w_init: 2.0

pattern_id: vi_S_V_roi_S_V
slots:
  - var: S1
  - gap: s+
    min: 0
  - var: V1
  - const: "rồi"
  - var: S2
  - gap: s+
    min: 0
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
  - "Em học rồi Bé ngủ"
  - "Mẹ nấu rồi Bố ăn"
  - "Lan chạy rồi em đi"
  - "Con mèo ngủ rồi con chó thức"
  - "Anh ấy viết rồi chị ấy đọc"
  - "Bé khóc rồi mẹ dỗ"
