pattern_id: vi_S_V_ma_S_V
slots:
  - var: S1
  - var: V1
  - const: "mà"
  - var: S2
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
