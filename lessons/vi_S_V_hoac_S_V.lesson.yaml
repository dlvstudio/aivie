lesson_id: vi_grade3_compound_hoac
grade: 3
repeat: 3
eta_teach: 0.5
w_init: 2.0

pattern_id: vi_S_V_hoac_S_V
slots:
  - var: S1
  - gap: s+
    min: 0
  - var: V1
  - const: "hoặc"
  - var: S2
  - gap: s+
    min: 0
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
  - "Em học hoặc Bé ngủ"
  - "Mẹ nấu hoặc Bố đọc"
  - "Lan chạy hoặc em đi"
  - "Con mèo ăn hoặc con chó uống"
  - "Anh ấy viết hoặc chị ấy vẽ"
  - "Bé hát hoặc mẹ nghe"
