lesson_id: vi_grade3_compound_va
grade: 3
repeat: 3
eta_teach: 0.5
w_init: 2.0

pattern_id: vi_S_V_va_S_V
slots:
  - var: S1
  - gap: s+
    min: 0
  - var: V1
  - const: "và"
  - var: S2
  - gap: s+
    min: 0
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
  - "Em học và Bé ngủ"
  - "Mẹ nấu và Bố đọc"
  - "Lan chạy và em đi"
  - "Con mèo ngủ và con chó sủa"
  - "Anh ấy viết và chị ấy đọc"
  - "Chúng em hát và cô giáo nghe"
