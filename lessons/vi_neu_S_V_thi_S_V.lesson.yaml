lesson_id: vi_grade5_conditional
grade: 5
repeat: 3
eta_teach: 0.5
w_init: 2.0

pattern_id: vi_neu_S_V_thi_S_V
slots:
  - const: "Nếu"
  - var: S1
  - var: V1
  - const: "thì"
  - var: S2
  - var: V2

bind:
  S1: chủ ngữ
  V1: động từ
  S2: chủ ngữ
  V2: động từ

examples:
  - "Nếu em học thì em nhớ"
  - "Nếu trời mưa thì em ngủ"
  - "Nếu Lan chạy thì Lan mệt"
  - "Nếu mẹ gọi thì em về"
  - "Nếu Bé ngủ thì mẹ nghỉ"
